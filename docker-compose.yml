version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: mps_postgres
    environment:
      POSTGRES_DB: mps_db
      POSTGRES_USER: mps_admin
      POSTGRES_PASSWORD: SecurePassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mps_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mps_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mps_db
      SPRING_DATASOURCE_USERNAME: mps_admin
      SPRING_DATASOURCE_PASSWORD: SecurePassword123!
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mps_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
